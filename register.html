<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Sparkling Dev</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <nav id="navbar">
    <a href="index.html" class="nav-logo">
      <div class="logo-mark"><span>S</span></div>
      <span class="logo-text">Sparkling<span>Dev</span></span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="portfolio.html">Portfolio</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <a href="login.html" class="nav-cta"><span>Login</span></a>
    <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
  </nav>
  <div class="mobile-nav" id="mobileNav">
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="contact.html">Contact</a>
    <a href="login.html">Login</a>
  </div>

  <!-- AUTH CARD -->
  <div class="auth-bg">
    <div class="auth-grid"></div>
    <div class="auth-glow"></div>

    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-mark"><span>S</span></div>
        <span class="logo-text">Sparkling<span>Dev</span></span>
      </div>

      <div class="auth-header">
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-sub">Register to track your orders & projects</p>
      </div>

      <!-- Alert box -->
      <div class="auth-alert" id="authAlert"></div>

      <form class="auth-form" id="registerForm">

        <div class="form-group">
          <label for="fullname">Full Name *</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="fullname" placeholder="Your full name" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="email" placeholder="your@email.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Phone / WhatsApp</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.42 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16.92z"/></svg>
            <input type="text" id="phone" placeholder="+237 6XX XXX XXX">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password *</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" placeholder="Min. 6 characters" required>
            <button type="button" class="toggle-pw" id="togglePw">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.5" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPw">Confirm Password *</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="confirmPw" placeholder="Repeat your password" required>
          </div>
        </div>

        <button type="submit" class="btn-auth" id="registerBtn">
          <span>Create Account</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>

      </form>

      <p class="auth-switch">
        Already have an account? <a href="login.html">Sign In</a>
      </p>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="main.js"></script>
  <script src="register.js"></script>
</body>
</html>
